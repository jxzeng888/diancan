<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="color-scheme" content="light">
  <title>宁都园秀饭店 · 点餐</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>

  <!-- 顶部标题栏 -->
  <header class="topbar">
    <h1>🏮 宁都园秀饭店</h1>
    <nav class="nav">
      <a href="#/menu">点餐</a>
      <a href="#/orders">订单<span class="badge" id="order-badge" hidden></span></a>
    </nav>
  </header>

  <main>
    <!-- ========== 视图一：点餐页（店式：左分类栏 + 右菜品） ========== -->
    <section id="view-menu" class="view view-menu">
      <div class="menu-layout">
        <!-- 左侧分类栏（JS 自动生成） -->
        <aside class="cat-rail" id="cat-rail"></aside>
        <!-- 右侧当前分类的菜品列表 -->
        <div class="dish-list" id="dish-list"></div>
      </div>
      <!-- 底部购物车栏 -->
      <div id="cart-bar" class="cart-bar hidden">
        <span id="cart-count">已选 0 个菜</span>
        <button id="btn-go-cart" class="btn btn-gold">去下单</button>
      </div>
    </section>

    <!-- ========== 视图二：下单确认页 ========== -->
    <section id="view-cart" class="view hidden">
      <h2 class="view-title">确认订单</h2>
      <div id="cart-list"></div>
      <button id="btn-back-menu" class="btn btn-ghost btn-block">← 返回菜单，继续加菜</button>
      <!-- 结算页唯一可编辑项：整单备注（大号醒目） -->
      <div class="remark-row lg order-remark-box">
        <label class="remark-label" for="order-remark">📝 整单备注（选填）</label>
        <input id="order-remark" class="remark-input lg" type="text" maxlength="50" placeholder="比如：多要两双筷子">
      </div>
      <button id="btn-submit" class="btn btn-gold btn-block">✅ 提交订单</button>
      <p class="tip">提交后自动按当天下单顺序编号「顾客1、顾客2…」（不用填名字），全家人（打开同一个链接的人）都能在「订单」里看到。</p>
    </section>

    <!-- ========== 视图三：订单（按日期查历史） ========== -->
    <section id="view-orders" class="view hidden">
      <h2 class="view-title">订单</h2>
      <!-- 日期导航（JS 自动生成：今天/昨天/历史日期 + 日期选择器） -->
      <div id="date-nav"></div>
      <div id="orders-list"></div>
      <button id="btn-clear" class="btn btn-danger btn-block hidden">🗑️ 清空这一天的订单</button>
      <!-- 菜单管理入口（小字，不影响顾客使用） -->
      <p class="admin-link-row"><a href="admin.html">⚙️ 菜单管理</a></p>
    </section>
  </main>

  <!-- 云端数据库（Supabase）：配置好 js/supabase-config.js 后，全家人共享订单和菜单 -->
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

  <script src="js/menu.js"></script>
  <script src="js/supabase-config.js"></script>
  <script src="js/store.js"></script>
  <script src="js/menu-store.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
